<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TutorAI — Aprenda no seu ritmo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2ff;color:#182444;font-family:Arial,sans-serif}
main{max-width:700px;margin:40px auto;padding:28px;background:white;border-radius:20px}
h1{color:#5145cd}
p{line-height:1.6}
label{display:block;margin-top:24px}
textarea{width:100%;min-height:110px;padding:15px;margin-top:10px;border:1px solid #aab4cc;border-radius:12px;font:inherit}
button{padding:12px 18px;margin:8px 4px 0 0;border:0;border-radius:10px;background:#5145cd;color:white;font:inherit;cursor:pointer}
#resposta{margin-top:24px;padding:20px;background:#f4f6ff;border-radius:12px;white-space:pre-wrap;line-height:1.7}
@media(max-width:750px){main{margin:16px;padding:22px}}
</style>
</head>
<body>
<main>
<h1>📚 TutorAI</h1>
<p>Aprenda com explicações e exemplos.</p>
<p>Esta versão consulta três assuntos cadastrados. Ainda não usa inteligência artificial.</p>

<form id="estudo">
<label for="pergunta">Qual assunto você quer entender?</label>
<textarea id="pergunta" placeholder="Exemplo: o que é uma fração?" required></textarea>
<button type="submit">Ver explicação</button>
</form>

<p>Ou escolha um assunto:</p>
<button type="button" data-assunto="fração">Frações</button>
<button type="button" data-assunto="porcentagem">Porcentagem</button>
<button type="button" data-assunto="fotossíntese">Fotossíntese</button>

<div id="resposta" role="status" aria-live="polite">Escolha um assunto para começar.</div>
</main>

<script>
const aulas = [
{
palavras: ["fracao", "fracoes"],
texto: `FRAÇÕES

Uma fração representa uma divisão. Ela também pode representar partes iguais de um todo.

Exemplo: uma pizza foi dividida em 8 fatias iguais. Se você comeu 3, comeu 3/8 da pizza.

• Numerador: o número de cima (3) indica quantas partes foram consideradas.
• Denominador: o número de baixo (8) indica em quantas partes iguais o todo foi dividido.

Frações equivalentes:
1/2 = 2/4. As duas representam a mesma quantidade.

Soma com denominadores iguais:
1/5 + 2/5 = 3/5.

Soma com denominadores diferentes:
1/2 + 1/4 = 2/4 + 1/4 = 3/4.

Pratique:
Uma barra tem 6 pedaços iguais. Você comeu 2. Qual fração representa o que comeu?

Confira depois de tentar: 2/6, que simplificada é 1/3.`
},
{
palavras: ["porcentagem", "percentagem", "por cento", "%"],
texto: `PORCENTAGEM

Porcentagem significa “por cento”, ou seja, uma quantidade em cada 100.

25% = 25/100 = 1/4.

Para calcular uma porcentagem:
multiplique o valor pela porcentagem e divida por 100.

Exemplo: quanto é 20% de 150?
150 × 20 ÷ 100 = 30.

Desconto:
Um produto custa R$ 150 e tem 20% de desconto.
O desconto é R$ 30.
Preço final: 150 − 30 = R$ 120.

Pratique:
Quanto é 10% de 80?

Confira depois de tentar: 8.`
},
{
palavras: ["fotossintese"],
texto: `FOTOSSÍNTESE

É o processo em que plantas, algas e algumas bactérias usam energia da luz para produzir açúcares.

Nas plantas, a clorofila ajuda a captar a luz. A planta utiliza água e gás carbônico para produzir açúcares e libera oxigênio.

Resumo:
água + gás carbônico + energia da luz → açúcares + oxigênio.

Os açúcares fornecem energia e matéria para o crescimento da planta.

Pratique:
Qual gás a planta utiliza nesse processo?

Confira depois de tentar: gás carbônico.`
}
];

function explicar(assunto) {
const busca = assunto.toLowerCase().normalize("NFD")
.replace(/[\u0300-\u036f]/g, "").trim();
if (!busca) return;
const aula = aulas.find(item =>
item.palavras.some(palavra => busca.includes(palavra)));
document.getElementById("resposta").textContent = aula
? aula.texto
: "Ainda não tenho uma explicação cadastrada para essa pergunta. Nesta versão, escolha frações, porcentagem ou fotossíntese.";
}

document.getElementById("estudo").addEventListener("submit", evento => {
evento.preventDefault();
explicar(document.getElementById("pergunta").value);
});

document.querySelectorAll("[data-assunto]").forEach(botao => {
botao.addEventListener("click", () => {
document.getElementById("pergunta").value = botao.dataset.assunto;
explicar(botao.dataset.assunto);
});
});
</script>
</body>
</html>
